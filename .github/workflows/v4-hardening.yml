name: VOWMARK V4 Hardening

on:
  push:
    branches: [v4-security-remediation, v4-final-certification]
  pull_request:
    branches: [v3-evidence-hardening]

permissions:
  contents: read

jobs:
  release-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_v4_release_consistency.py

  python-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest tests -q
      - run: python -m compileall -q contracts/vowmark-contracts/contracts

  direct-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest genlayer-test==0.29.2
      - run: python -m pytest tests/direct -q -p gltest_direct

  simulator-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest "genlayer-test[sim]==0.29.2"
      - name: Cache published GenVM simulator bundle
        run: |
          mkdir -p "$HOME/.cache/gltest-direct"
          curl --fail --location --retry 3 \
            "https://github.com/genlayerlabs/genvm/releases/download/v0.2.16/genvm-universal.tar.xz" \
            --output "$HOME/.cache/gltest-direct/genvm-universal-v0.2.16.tar.xz"
      - run: python -m pytest tests/sim -q

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest "genlayer-test[sim]==0.29.2" genlayer-test==0.29.2
      - name: Cache published GenVM simulator bundle
        run: |
          mkdir -p "$HOME/.cache/gltest-direct"
          curl --fail --location --retry 3 \
            "https://github.com/genlayerlabs/genvm/releases/download/v0.2.16/genvm-universal.tar.xz" \
            --output "$HOME/.cache/gltest-direct/genvm-universal-v0.2.16.tar.xz"
      - run: python scripts/run_mutation_tests.py

  web-and-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:board
      - run: npm run test:timezone
      - run: npm run test:issue
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
